[project]
name = "nervex-soulgraph"
version = "0.1.0"
description = "Autonomous Research Translation & Execution Engine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.1.0",
    "neo4j>=5.20.0",
    "chromadb>=0.5.0",
    "docker>=7.1.0",
    "torch>=2.3.0",
    "networkx>=3.3",
    "sentence-transformers>=3.0.0",
    "marker-pdf>=0.3.0",
    "surya-ocr>=0.5.0",
    "einops>=0.8.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "marker>=2.1.3",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.2.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
[tool.setuptools]
# Only real code packages. data/, uploads/ and execution_artifacts/ are runtime folders that git does not
# track, so listing them made `uv sync` fail on every fresh clone (and therefore CI).
py-modules = ["config", "main"]
packages = ["db", "api", "agents", "sandbox", "features", "ingestion", "explainer"]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
